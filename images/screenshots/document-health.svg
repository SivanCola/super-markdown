<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Super Markdown document health and cleanup</title>
  <desc id="desc">A VS Code style window showing Markdown health checks and an organize Markdown diff preview.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="18" fill="#111315"/>
  <rect x="24" y="24" width="1232" height="672" rx="14" fill="#1e1f22" filter="url(#shadow)"/>
  <rect x="24" y="24" width="1232" height="46" rx="14" fill="#303236"/>
  <circle cx="50" cy="47" r="8" fill="#ff5f57"/>
  <circle cx="76" cy="47" r="8" fill="#febc2e"/>
  <circle cx="102" cy="47" r="8" fill="#28c840"/>
  <text x="150" y="53" fill="#d7dbe2" font-family="Inter, Arial, sans-serif" font-size="15">Super Markdown: document review</text>
  <rect x="60" y="104" width="526" height="540" rx="10" fill="#18191c" stroke="#343740"/>
  <rect x="60" y="104" width="526" height="48" rx="10" fill="#25272c"/>
  <text x="88" y="135" fill="#f0f2f5" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Document Health</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="88" y="186" width="470" height="62" rx="8" fill="#2b2418" stroke="#b9822b"/>
    <circle cx="116" cy="217" r="8" fill="#f2b84b"/>
    <text x="140" y="212" fill="#f4d7a3" font-size="16" font-weight="700">Skipped heading level</text>
    <text x="140" y="234" fill="#d8c7aa" font-size="13">Line 42 jumps from H2 to H4.</text>
    <rect x="88" y="268" width="470" height="62" rx="8" fill="#2b1f22" stroke="#c45a64"/>
    <circle cx="116" cy="299" r="8" fill="#f7768e"/>
    <text x="140" y="294" fill="#f5b6c0" font-size="16" font-weight="700">Broken local image</text>
    <text x="140" y="316" fill="#dbc2c6" font-size="13">images/missing-flow.png cannot be found.</text>
    <rect x="88" y="350" width="470" height="62" rx="8" fill="#222936" stroke="#5f8ac7"/>
    <circle cx="116" cy="381" r="8" fill="#7aa2f7"/>
    <text x="140" y="376" fill="#c7d9ff" font-size="16" font-weight="700">Stale table of contents</text>
    <text x="140" y="398" fill="#bfcae0" font-size="13">Generated TOC no longer matches headings.</text>
    <rect x="88" y="432" width="470" height="62" rx="8" fill="#1e2a22" stroke="#4f9a65"/>
    <circle cx="116" cy="463" r="8" fill="#73d18b"/>
    <text x="140" y="458" fill="#c6f1d1" font-size="16" font-weight="700">Unchecked tasks</text>
    <text x="140" y="480" fill="#bdd7c5" font-size="13">4 open tasks remain in this document.</text>
  </g>
  <rect x="626" y="104" width="594" height="540" rx="10" fill="#18191c" stroke="#343740"/>
  <rect x="626" y="104" width="594" height="48" rx="10" fill="#25272c"/>
  <text x="654" y="135" fill="#f0f2f5" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Organize Markdown diff</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="654" y="186" width="252" height="400" rx="8" fill="#202124" stroke="#343740"/>
    <rect x="938" y="186" width="252" height="400" rx="8" fill="#202124" stroke="#343740"/>
    <text x="674" y="218" fill="#9aa0aa">Before</text>
    <text x="958" y="218" fill="#9aa0aa">After</text>
    <text x="674" y="270" fill="#d7dbe2">## Overview</text>
    <text x="674" y="314" fill="#d7dbe2">-item one</text>
    <text x="674" y="358" fill="#d7dbe2">- [ ]task</text>
    <text x="674" y="402" fill="#d7dbe2">|a|b|</text>
    <text x="674" y="446" fill="#d7dbe2">|-|-|</text>
    <text x="674" y="490" fill="#d7dbe2">|1|2|</text>
    <rect x="958" y="252" width="210" height="28" fill="#173b24"/>
    <text x="958" y="270" fill="#b6f0c2">## 1. Overview</text>
    <rect x="958" y="296" width="210" height="28" fill="#173b24"/>
    <text x="958" y="314" fill="#b6f0c2">- item one</text>
    <rect x="958" y="340" width="210" height="28" fill="#173b24"/>
    <text x="958" y="358" fill="#b6f0c2">- [ ] task</text>
    <rect x="958" y="384" width="210" height="28" fill="#173b24"/>
    <text x="958" y="402" fill="#b6f0c2">| a | b |</text>
    <rect x="958" y="428" width="210" height="28" fill="#173b24"/>
    <text x="958" y="446" fill="#b6f0c2">| - | - |</text>
    <rect x="958" y="472" width="210" height="28" fill="#173b24"/>
    <text x="958" y="490" fill="#b6f0c2">| 1 | 2 |</text>
  </g>
  <rect x="806" y="604" width="232" height="42" rx="8" fill="#2f6f44"/>
  <text x="854" y="631" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Review, then apply</text>
</svg>
