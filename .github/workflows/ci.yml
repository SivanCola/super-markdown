name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Test
        run: npm test

      - name: Package VSIX
        run: |
          mkdir -p dist
          npx @vscode/vsce package --out dist/super-markdown.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: super-markdown-vsix
          path: dist/super-markdown.vsix
