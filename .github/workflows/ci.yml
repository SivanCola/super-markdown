name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Test
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Webview toolbar
        run: npm run test:webview-toolbar

      - name: Package VSIX
        run: npm run package:vsix

      - name: Verify VSIX contents
        run: npm run verify:vsix-contents

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: super-markdown-vsix
          path: dist/super-markdown.vsix
