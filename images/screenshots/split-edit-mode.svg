<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Super Markdown split edit mode with sample content</title>
  <desc id="desc">A VS Code style window with a sample Markdown guide on the left, rendered preview in the center, and a floating outline on the right.</desc>
  <defs>
    <linearGradient id="titlebar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#323438"/>
      <stop offset="1" stop-color="#25272b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="18" fill="#111315"/>
  <rect x="24" y="24" width="1232" height="672" rx="14" fill="#1e1f22" filter="url(#shadow)"/>
  <rect x="24" y="24" width="1232" height="46" rx="14" fill="url(#titlebar)"/>
  <circle cx="50" cy="47" r="8" fill="#ff5f57"/>
  <circle cx="76" cy="47" r="8" fill="#febc2e"/>
  <circle cx="102" cy="47" r="8" fill="#28c840"/>
  <rect x="188" y="35" width="410" height="24" rx="6" fill="#3a3d42"/>
  <text x="204" y="52" fill="#cfd2d6" font-family="Inter, Arial, sans-serif" font-size="13">sample-guide.md</text>
  <rect x="24" y="70" width="54" height="626" fill="#25262a"/>
  <rect x="44" y="102" width="16" height="20" rx="3" fill="#858b95"/>
  <rect x="44" y="154" width="16" height="16" rx="8" fill="#858b95"/>
  <rect x="44" y="205" width="16" height="20" rx="3" fill="#858b95"/>
  <rect x="44" y="256" width="16" height="18" rx="3" fill="#5fb3ff"/>
  <rect x="78" y="70" width="564" height="626" fill="#18191c"/>
  <rect x="642" y="70" width="614" height="626" fill="#202124"/>
  <line x1="642" y1="70" x2="642" y2="696" stroke="#36383d"/>
  <text x="104" y="108" fill="#8f949e" font-family="Inter, Arial, sans-serif" font-size="14">Markdown source</text>
  <text x="682" y="108" fill="#8f949e" font-family="Inter, Arial, sans-serif" font-size="14">Rendered preview</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="104" y="154" fill="#5fb3ff"># Project Guide</text>
    <text x="104" y="198" fill="#5fb3ff">## Overview</text>
    <text x="104" y="242" fill="#5fb3ff">## Getting Started</text>
    <text x="104" y="286" fill="#d7dbe2">- Install the extension</text>
    <text x="104" y="330" fill="#d7dbe2">- Open a Markdown document</text>
    <rect x="104" y="356" width="426" height="156" rx="8" fill="#23262b" stroke="#3d4148"/>
    <text x="126" y="394" fill="#9cdcfe">```json</text>
    <text x="126" y="430" fill="#d7dbe2">{ "theme": "warm-paper" }</text>
    <text x="126" y="466" fill="#d7dbe2">{ "outline": true }</text>
    <text x="126" y="502" fill="#9cdcfe">```</text>
    <text x="104" y="562" fill="#5fb3ff">## Review Checklist</text>
    <text x="104" y="606" fill="#d7dbe2">- [ ] Check links and headings</text>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="684" y="156" fill="#e7eaf0" font-size="24" font-weight="700">Getting Started</text>
    <circle cx="702" cy="202" r="3" fill="#d7dbe2"/>
    <text x="722" y="208" fill="#d7dbe2" font-size="17">Install the extension</text>
    <circle cx="702" cy="244" r="3" fill="#d7dbe2"/>
    <text x="722" y="250" fill="#d7dbe2" font-size="17">Open a Markdown document</text>
    <rect x="684" y="284" width="424" height="154" rx="9" fill="#191a1d" stroke="#3d4148"/>
    <text x="704" y="322" fill="#8f949e" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16">json</text>
    <text x="704" y="374" fill="#d7dbe2" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">{ "theme": "warm-paper" }</text>
    <rect x="684" y="492" width="404" height="38" rx="4" fill="#26415f" stroke="#5fb3ff"/>
    <text x="696" y="518" fill="#ffffff" font-size="24" font-weight="700">Review Checklist</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1000" y="112" width="224" height="504" rx="10" fill="#2b2d31" stroke="#4b4f57"/>
    <text x="1022" y="146" fill="#f0f2f5" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Floating outline</text>
    <rect x="1020" y="166" width="184" height="30" rx="6" fill="#3a3d42"/>
    <text x="1034" y="187" fill="#9aa0aa" font-family="Inter, Arial, sans-serif" font-size="13">Search headings</text>
    <g font-family="Inter, Arial, sans-serif" font-size="14">
      <text x="1022" y="232" fill="#9aa0aa">H1</text>
      <text x="1060" y="232" fill="#e4e7ec">Project Guide</text>
      <text x="1022" y="272" fill="#9aa0aa">H2</text>
      <text x="1060" y="272" fill="#e4e7ec">Overview</text>
      <text x="1022" y="312" fill="#9aa0aa">H2</text>
      <text x="1060" y="312" fill="#e4e7ec">Getting Started</text>
      <rect x="1018" y="342" width="186" height="34" rx="5" fill="#3d4d64" stroke="#f2b84b"/>
      <text x="1028" y="364" fill="#f2f5fa">H2</text>
      <text x="1066" y="364" fill="#ffffff">Review Checklist</text>
      <text x="1022" y="420" fill="#9aa0aa">H2</text>
      <text x="1060" y="420" fill="#e4e7ec">Troubleshooting</text>
      <text x="1022" y="460" fill="#9aa0aa">H2</text>
      <text x="1060" y="460" fill="#e4e7ec">Release Notes</text>
    </g>
  </g>
</svg>
