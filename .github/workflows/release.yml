name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Test
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Webview toolbar
        run: npm run test:webview-toolbar

      - name: Package VSIX
        run: npm run package:vsix

      - name: Verify VSIX contents
        run: npm run verify:vsix-contents

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath dist/super-markdown.vsix --skip-duplicate -p "$VSCE_PAT"

      - name: Verify Open VSX token
        if: env.OVSX_PAT != ''
        run: |
          for attempt in 1 2 3; do
            npx ovsx verify-pat SivanLiu -p "$OVSX_PAT" && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          for attempt in 1 2 3; do
            npx ovsx publish dist/super-markdown.vsix \
              --skip-duplicate \
              --baseContentUrl "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/" \
              --baseImagesUrl "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/" \
              -p "$OVSX_PAT" && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/super-markdown.vsix
